<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACKOFE — 24 s vertikal reklama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   0) TOKENLAR (CONFIG.palette JS orqali qayta yoziladi)
   ============================================================ */
:root{
  --bg:#FBF6F0; --bg2:#F1E4D6; --ink:#2A1D14; --inkSoft:#6E5947;
  --accent:#A85A28; --accent2:#7A4520; --accentL:#C87A34;
  --glow:rgba(168,90,40,.22);
  --glass:rgba(255,255,255,.62);
  --line:rgba(42,29,20,.10);
  --fontH:"Sora","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fontB:"Inter","Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --stageW:1080px; --stageH:1920px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1A1109}
body{font-family:var(--fontB);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{
  position:absolute;left:50%;top:50%;width:var(--stageW);height:var(--stageH);
  transform-origin:50% 50%;overflow:hidden;background:var(--bg);isolation:isolate;
  contain:paint;
}
/* ============================================================
   1) QATLAMLAR
   ============================================================ */
#bg{position:absolute;inset:0;z-index:0;pointer-events:none}
#blobs{position:absolute;inset:-12%;z-index:1;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
#tiles{position:absolute;inset:0;z-index:2;pointer-events:none}
.tile{position:absolute;border-radius:26px;background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
  will-change:transform}
#dust{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:3;pointer-events:none}
#scenes{position:absolute;inset:0;z-index:4}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none}
.scene.on{pointer-events:auto}
.cam{position:absolute;inset:0;will-change:transform}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none}
.grid{position:absolute;inset:0;opacity:.5;background-image:
  linear-gradient(rgba(42,29,20,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(42,29,20,.05) 1px,transparent 1px);background-size:120px 120px}
.vig{position:absolute;inset:0;background:radial-gradient(122% 82% at 50% 42%,transparent 42%,rgba(96,62,36,.20) 100%)}
.grain{position:absolute;inset:-20px;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#ui{position:absolute;inset:0;z-index:6;pointer-events:none}
/* ============================================================
   2) UI
   ============================================================ */
#bars{position:absolute;left:72px;right:72px;top:40px;display:flex;gap:12px}
.bar{flex:1;height:6px;border-radius:99px;background:rgba(42,29,20,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accentL));
  transform:scaleX(0);transform-origin:left center}
#soundBtn{position:absolute;right:72px;bottom:330px;width:104px;height:104px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);pointer-events:auto;
  box-shadow:0 18px 40px -20px rgba(74,43,23,.45)}
#soundBtn svg{width:44px;height:44px;display:block}
#soundBtn .ic-off{display:none}
#soundBtn[aria-pressed="false"] .ic-on{display:none}
#soundBtn[aria-pressed="false"] .ic-off{display:block}
/* ============================================================
   3) UMUMIY TIPOGRAFIKA
   ============================================================ */
.kicker{font-family:var(--fontB);font-weight:600;letter-spacing:.34em;text-transform:uppercase;
  font-size:40px;color:var(--ink);text-align:center}
.kicker.sub{font-size:32px;letter-spacing:.42em;color:var(--inkSoft)}
.wordmark{font-family:var(--fontH);font-weight:800;letter-spacing:-.03em;font-size:104px;color:var(--ink);text-align:center;
  overflow:hidden;padding-bottom:.16em;margin-bottom:-.16em}
.revsub{font-size:38px;font-weight:500;color:var(--inkSoft);text-align:center;letter-spacing:-.01em}
h1.hero{font-family:var(--fontH);font-weight:800;letter-spacing:-.035em;line-height:1.02;font-size:108px;color:var(--ink);text-wrap:balance}
h2.stmt{font-family:var(--fontH);font-weight:700;letter-spacing:-.03em;line-height:1.14;font-size:80px;color:var(--ink)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.16em;margin-bottom:-.16em;margin-right:.24em}
.wi{display:inline-block;will-change:transform,filter}
.w.acc .wi{color:var(--accent)}
@supports (-webkit-background-clip:text){
  .w.acc .wi{background:linear-gradient(96deg,var(--accent),var(--accentL));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
}
.w .ul{position:absolute;left:0;bottom:.06em;height:8px;width:88%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accentL));transform:scaleX(0);transform-origin:left center}
.w.acc{position:relative}
.pill{display:inline-flex;align-items:center;gap:14px;font-family:var(--fontB);font-weight:600;
  font-size:32px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:99px;padding:16px 34px;
  box-shadow:0 18px 40px -26px rgba(74,43,23,.5)}
.chiprow{position:absolute;left:72px;right:72px;display:flex;gap:18px;flex-wrap:wrap}
.chip{font-size:34px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.72);
  border:1px solid var(--line);border-radius:99px;padding:18px 32px;
  box-shadow:0 16px 34px -24px rgba(74,43,23,.45);will-change:transform,opacity}
/* mark */
.markwrap{will-change:transform,opacity}
.markwrap svg{width:100%;height:100%;display:block}
/* panel / demo */
.panel{position:absolute;left:96px;top:496px;width:888px;height:772px;border-radius:28px;
  background:var(--glass);border:1px solid var(--line);
  box-shadow:0 30px 70px -34px rgba(122,69,32,.45), inset 0 1px 0 rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;gap:36px;padding:48px}
.panel .left{width:288px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brewcup{position:relative;width:236px;height:236px;border-radius:50%;overflow:hidden;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.brewfill{position:absolute;left:0;right:0;bottom:0;height:0;
  background:linear-gradient(180deg,#6B3E20,#3E2110)}
.brewfill::after{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;border-radius:50%;
  background:#7A4A26}
.panel .right{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
.ptitle{font-family:var(--fontH);font-weight:700;font-size:46px;letter-spacing:-.02em;color:var(--ink)}
.row .rt{display:flex;justify-content:space-between;align-items:baseline;font-size:32px;font-weight:500;color:var(--ink);margin-bottom:12px}
.row .rs{font-size:28px;color:var(--inkSoft)}
.track{height:10px;border-radius:99px;background:rgba(42,29,20,.10);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));
  transform:scaleX(0);transform-origin:left center}
.term{font-family:var(--fontB);font-weight:500;font-size:32px;color:var(--ink);background:rgba(255,255,255,.6);
  border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:flex;align-items:center}
.caret{display:inline-block;width:4px;height:34px;background:var(--accent);margin-left:8px;border-radius:2px}
.demoNote{position:absolute;left:0;right:0;top:1320px;text-align:center;font-size:30px;color:var(--inkSoft)}
/* features */
.grid6{position:absolute;left:80px;top:420px;width:920px;display:grid;grid-template-columns:repeat(2,440px);
  grid-auto-rows:300px;gap:40px}
.card{position:relative;border-radius:28px;background:var(--glass);border:1px solid var(--line);padding:32px;
  box-shadow:0 26px 60px -30px rgba(122,69,32,.42), inset 0 1px 0 rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:18px;
  will-change:transform,opacity}
.num{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
  font-family:var(--fontH);font-weight:700;font-size:26px;color:#fff;
  background:linear-gradient(140deg,var(--accentL),var(--accent2));box-shadow:0 14px 26px -14px rgba(122,69,32,.8)}
.card h3{position:relative;display:inline-block;font-family:var(--fontH);font-weight:700;font-size:44px;
  letter-spacing:-.02em;color:var(--ink);padding-bottom:14px}
.card h3 .ul{position:absolute;left:0;bottom:0;height:6px;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accentL));transform:scaleX(0);transform-origin:left center}
.card p{font-size:30px;font-weight:500;line-height:1.28;color:var(--inkSoft);margin-top:-2px}
/* proof */
.stmtLabel{position:absolute;left:0;right:0;top:620px;text-align:center;font-size:32px;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;color:var(--inkSoft)}
.stmtBox{position:absolute;left:80px;right:80px;top:740px;text-align:center;text-wrap:balance}
.stmtLine{display:block}
/* offer */
.priceWrap{position:absolute;left:0;right:0;top:846px;text-align:center;will-change:transform,opacity}
.price{font-family:var(--fontH);font-weight:800;letter-spacing:-.045em;line-height:.94;font-size:220px;color:var(--ink)}
.price .cur{font-size:70px;letter-spacing:-.01em;margin-left:20px;color:var(--inkSoft);font-weight:700}
.priceNote{position:absolute;left:0;right:0;top:1120px;text-align:center;font-size:40px;font-weight:500;color:var(--inkSoft)}
.offerBadge{position:absolute;left:0;right:0;top:1230px;text-align:center}
.offerBadge span{display:inline-block;font-size:32px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(168,90,40,.34);border-radius:99px;padding:14px 30px;background:rgba(255,255,255,.6)}
.bullets{position:absolute;left:0;right:0;top:1360px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:0 72px}
.bullet{font-size:30px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line);
  border-radius:99px;padding:14px 26px;will-change:transform,opacity}
/* cta */
.ctaLock{position:absolute;left:0;right:0;top:520px;display:flex;flex-direction:column;align-items:center;gap:26px}
.ctaLock .markwrap{width:240px;height:240px}
.ctaPromise{position:absolute;left:80px;right:80px;top:960px;text-align:center;font-size:44px;font-weight:500;
  line-height:1.2;color:var(--ink)}
.btn{position:absolute;left:0;right:0;top:1084px;margin:0 auto;width:700px;height:140px;border-radius:99px;
  display:inline-flex;align-items:center;justify-content:center;gap:20px;text-decoration:none;overflow:hidden;
  font-family:var(--fontH);font-weight:700;font-size:46px;letter-spacing:-.02em;color:#fff;
  background:linear-gradient(112deg,var(--accentL),var(--accent) 55%,var(--accent2));
  box-shadow:0 26px 60px -22px rgba(122,69,32,.75), inset 0 1px 0 rgba(255,255,255,.32);
  will-change:transform,opacity;pointer-events:auto}
.btn svg{width:38px;height:38px}
.sheen{position:absolute;top:0;bottom:0;width:220px;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0))}
.glowring{position:absolute;left:190px;right:190px;top:1054px;height:200px;border-radius:99px;pointer-events:none;
  box-shadow:0 0 0 0 rgba(200,122,52,.45)}
.ctaPill{position:absolute;left:0;right:0;top:1300px;display:flex;justify-content:center}
.ctaPill span{font-size:34px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.72);
  border:1px solid var(--line);border-radius:99px;padding:16px 34px}
.ctaFoot{position:absolute;left:0;right:0;top:1430px;text-align:center;font-size:30px;color:var(--inkSoft);letter-spacing:.06em}
/* misc */
.rule{position:absolute;left:390px;top:1520px;width:300px;height:4px;border-radius:99px;
  background:linear-gradient(90deg,rgba(168,90,40,0),var(--accent),rgba(168,90,40,0));transform:scaleX(0);will-change:transform,opacity}
.svgwrap{position:absolute;left:0;right:0;pointer-events:none}
.hud{position:absolute;inset:0;overflow:visible}
.hudring{fill:none;stroke:rgba(168,90,40,.34);stroke-width:2}
.hudring.thin{stroke:rgba(42,29,20,.14);stroke-width:1.5}
.hudtick{stroke:rgba(168,90,40,.5);stroke-width:3;fill:none;stroke-linecap:round}
.shockc{fill:none;stroke:var(--accent);stroke-width:5;transform-box:fill-box;transform-origin:50% 50%}
.shockc.second{stroke:rgba(122,69,32,.4);stroke-width:3}
.spkl{stroke:rgba(200,122,52,.75);stroke-width:5;stroke-linecap:round}
.markwrap[data-dim]{filter:blur(9px)}
[data-in],[data-kind]{will-change:transform,opacity}
.export #ui{display:none}
.export #scenes{pointer-events:none}
.export .btn,.export #soundBtn{pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="blobs"><span class="blob" id="blob1"></span><span class="blob" id="blob2"></span><span class="blob" id="blob3"></span></div>
  <div id="tiles"></div>
  <canvas id="dust"></canvas>

  <div id="scenes">
    <!-- 1 SPARK -->
    <section class="scene" id="sc-spark" data-scene="0">
      <div class="cam">
        <div class="svgwrap" style="top:520px;height:700px">
          <svg class="hud" viewBox="0 0 700 700" aria-hidden="true">
            <circle class="hudring" data-in=".05" data-dur=".9" data-kind="draw" cx="350" cy="350" r="300"/>
            <circle class="hudring thin" data-in=".28" data-dur="1" data-kind="draw" cx="350" cy="350" r="230"/>
            <circle class="hudring thin" data-in=".5" data-dur="1" data-kind="draw" cx="350" cy="350" r="160"/>
            <path class="hudtick" data-in=".7" data-dur=".8" data-kind="draw" d="M350 14 L350 72 M350 628 L350 686 M14 350 L72 350 M628 350 L686 350"/>
          </svg>
          <div class="markwrap" id="markSpark" data-in=".9" data-dur="1" data-kind="mark" data-scale=".6"
               style="position:absolute;left:250px;top:150px;width:200px;height:200px"></div>
        </div>
        <div class="kicker" style="position:absolute;left:0;right:0;top:1270px" data-in=".7" data-dur=".8"
             data-kind="rise" data-sfx-type="subtext" data-sfx-delay="700">MACKOFE</div>
        <div class="kicker sub" style="position:absolute;left:0;right:0;top:1352px" data-in="1.05" data-dur=".7"
             data-kind="rise" data-sfx-type="subtext" data-sfx-delay="1050">QAHVA</div>
      </div>
    </section>

    <!-- 2 REVEAL -->
    <section class="scene" id="sc-reveal" data-scene="1">
      <div class="cam">
        <div class="svgwrap" style="top:470px;height:800px">
          <svg class="hud" viewBox="0 0 800 800" aria-hidden="true">
            <g id="sparkGroup" style="transform-origin:400px 400px">
              <circle class="shockc" data-in="0" data-dur="1.15" data-kind="burst" cx="400" cy="400" r="330"/>
              <circle class="shockc second" data-in=".14" data-dur="1.3" data-kind="burst" cx="400" cy="400" r="240"/>
            </g>
            <g id="sparkLines"></g>
          </svg>
          <div class="markwrap" id="markReveal" data-in=".1" data-dur=".9" data-kind="mark"
               style="position:absolute;left:220px;top:220px;width:360px;height:360px"></div>
        </div>
        <div class="wordmark" style="position:absolute;left:0;right:0;top:1310px" data-in=".45" data-dur=".7"
             data-kind="word" data-sfx-type="headline" data-sfx-delay="450"><span class="wi">MACKOFE</span></div>
        <div class="revsub" style="position:absolute;left:0;right:0;top:1444px" data-in=".8" data-dur=".6"
             data-kind="rise" data-sfx-type="subtext" data-sfx-delay="800">Kundagi birinchi ritm</div>
        <div class="rule" data-in="1" data-dur=".8" data-kind="wrule"></div>
      </div>
    </section>

    <!-- 3 HOOK -->
    <section class="scene" id="sc-hook" data-scene="2">
      <div class="cam">
        <div class="pill" style="position:absolute;left:72px;top:452px" data-in=".15" data-dur=".6"
             data-kind="pop" data-sfx-type="badge" data-sfx-delay="150">Qahva</div>
        <h1 class="hero" id="heroLine" style="position:absolute;left:72px;right:72px;top:520px"></h1>
        <div class="markwrap" id="markHook" data-in=".3" data-dur="1" data-kind="mark" data-scale=".88" data-float="1"
             style="position:absolute;left:640px;top:930px;width:330px;height:330px"></div>
        <div class="chiprow" id="chipRow" style="top:1440px"></div>
      </div>
    </section>

    <!-- 4 DEMO -->
    <section class="scene" id="sc-demo" data-scene="3">
      <div class="cam">
        <div class="panel" data-in=".15" data-dur=".8" data-kind="rise">
          <div class="left">
            <div class="brewcup">
              <div class="brewfill" id="brewFill" data-in=".4" data-dur="1.9" data-kind="brew" data-val=".84"></div>
            </div>
          </div>
          <div class="right">
            <div class="ptitle" data-in=".4" data-dur=".6" data-kind="rise" data-sfx-type="subtext" data-sfx-delay="400">Tayyorlash</div>
            <div class="row" data-in=".7" data-dur=".55" data-kind="rise" data-sfx-type="feature" data-sfx-delay="700">
              <div class="rt"><span>Qovurilgan</span><span class="rs">boshqich</span></div>
              <div class="track"><i data-in=".82" data-dur=".9" data-kind="fill" data-val="1"></i></div>
            </div>
            <div class="row" data-in=".95" data-dur=".55" data-kind="rise" data-sfx-type="feature" data-sfx-delay="950">
              <div class="rt"><span>Maydalangan</span><span class="rs">d don</span></div>
              <div class="track"><i data-in="1.07" data-dur=".9" data-kind="fill" data-val=".62"></i></div>
            </div>
            <div class="row" data-in="1.2" data-dur=".55" data-kind="rise" data-sfx-type="feature" data-sfx-delay="1200">
              <div class="rt"><span>Damlanmoqda</span><span class="rs">piyol</span></div>
              <div class="track"><i data-in="1.32" data-dur=".9" data-kind="fill" data-val=".34"></i></div>
            </div>
            <div class="term"><span class="typed" id="typed" data-in="1.6" data-dur="1.2" data-kind="type"
              data-text="qahva tayyor — istalgan paytdan boshlash"
              data-sfx-type="type"></span><i class="caret" id="caret"></i></div>
          </div>
        </div>
        <div class="demoNote" data-in="1.9" data-dur=".45" data-kind="rise" data-sfx-type="subtext" data-sfx-delay="1900">namoyish</div>
      </div>
    </section>

    <!-- 5 FEATURES -->
    <section class="scene" id="sc-features" data-scene="4">
      <div class="cam">
        <div class="kicker sub" style="position:absolute;left:0;right:0;top:300px" data-in=".15" data-dur=".6"
             data-kind="rise" data-sfx-type="subtext" data-sfx-delay="150">Nima beradi</div>
        <div class="grid6" id="cardGrid"></div>
      </div>
    </section>

    <!-- 6 PROOF -->
    <section class="scene" id="sc-proof" data-scene="5">
      <div class="cam">
        <div class="markwrap" id="markProof" data-in=".1" data-dur="1.2" data-kind="mark" data-scale="1.5" data-dim="1"
             style="position:absolute;left:390px;top:790px;width:300px;height:300px"></div>
        <div class="stmtLabel" data-in=".2" data-dur=".6" data-kind="rise" data-sfx-type="subtext" data-sfx-delay="200">Umumiy foyda</div>
        <div class="stmtBox" id="stmtBox"></div>
      </div>
    </section>

    <!-- 7 OFFER -->
    <section class="scene" id="sc-offer" data-scene="6">
      <div class="cam">
        <div class="markwrap" id="markOffer" data-in=".1" data-dur=".8" data-kind="mark" data-scale=".62"
             style="position:absolute;left:440px;top:440px;width:200px;height:200px"></div>
        <div class="priceWrap" id="priceWrap" data-in=".25" data-dur=".8" data-kind="rise" data-sfx-type="price" data-sfx-delay="250">
          <span class="price" id="priceMain">45 000<span class="cur">so‘m</span></span>
        </div>
        <div class="priceNote" data-in=".7" data-dur=".5" data-kind="rise" data-sfx-type="subtext" data-sfx-delay="700" id="priceNote">250 g qop</div>

function audioInit() {
  if (A.ctx || A.dead) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  A.ctx = new AC();
  A.g = buildGraph(A.ctx);
  A.base = A.ctx.currentTime + .08;
  A.next = 0;
  A.timer = setInterval(audioTick, 120);
}
function audioStart() {
  if (!A.ctx || A.started) return;
  if (A.ctx.state === 'suspended') A.ctx.resume();
  if (A.ctx.state !== 'running') return;      /* faqat ctx running bo'lganda */
  A.started = true;
  A.base = A.ctx.currentTime + .06;
  A.next = 0;
  g_playFrom = 0;
  armTail(A.g, A.base);
  playEvent(A.g, { t: 0, type: 'subtext' }, A.base + .02);   /* start chime */
  audioTick();
}
function audioSeek(tNow) {                    /* joriy vaqtdan qayta rejalashtirish */
  if (!A.ctx || !A.g) return;
  stopLive(A.g);
  A.base = A.ctx.currentTime - tNow;
  A.next = 0;
  while (A.next < EVENTS.length && EVENTS[A.next].t < tNow) A.next++;
  if (A.started) armTail(A.g, A.base);
}
function audioTick() {
  if (!A.ctx || A.ctx.state !== 'running' || A.muted) return;
  const now = A.ctx.currentTime, t = now - A.base;
  if (t >= DURATION) { audioLoop(); return; }
  while (A.next < EVENTS.length && EVENTS[A.next].t < t + .7) {
    playEvent(A.g, EVENTS[A.next], A.base + EVENTS[A.next].t);
    A.next++;
  }
}
function stopLive(g) {
  if (!g || !g.live) return;
  const now = g.ctx.currentTime;
  for (let i = 0; i < g.live.length; i++) { try { g.live[i].stop(now); } catch (e) {} try { g.live[i].disconnect(); } catch (e) {} }
  g.live.length = 0;
  try { g.fader.gain.cancelScheduledValues(now); g.fader.gain.setValueAtTime(1, now); } catch (e) {}
  try { g.music.gain.cancelScheduledValues(now); g.music.gain.setValueAtTime(1, now); } catch (e) {}
}
function audioLoop() {
  stopLive(A.g);
  A.base = A.ctx.currentTime + .05;
  A.next = 0;
  g_playFrom = 0;
  armTail(A.g, A.base);
}
function audioMute() {
  if (!A.ctx || !A.g) return;
  const t = A.ctx.currentTime;
  A.g.master.gain.cancelScheduledValues(t);
  A.g.master.gain.setValueAtTime(A.muted ? .0001 : MASTER_GAIN, t);
  if (A.muted) { stopLive(A.g); A.next = 0; }
}
function audioDispose() {
  A.dead = true;
  if (A.timer) clearInterval(A.timer); A.timer = null;
  if (A.ctx) { try { A.ctx.close(); } catch (e) {} }
  A.ctx = null; A.g = null;
}

/* ================================================================
   9) OFFLINE RENDER (MP4 uchun WAV)
   ================================================================ */
function encodeWav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  const ab = new ArrayBuffer(44 + len * ch * 2), dv = new DataView(ab);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true);
  dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); str(36, 'data');
  dv.setUint32(40, len * ch * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const s = Math.max(-1, Math.min(1, chans[c][i]));
    dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2;
  }
  const u8 = new Uint8Array(ab); let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function renderAudioWav() {
  const sr = 48000;
  const oc = new OfflineAudioContext(2, Math.ceil(DURATION * sr), sr);
  const g = buildGraph(oc);
  scheduleAll(g, 0, DURATION);
  const buf = await oc.startRendering();
  return encodeWav(buf);
}

/* ================================================================
   10) PLAYER, O'LCHOV, HODISA
   ============================================================ */
const stage = $('#stage');
let g_playFrom = 0, g_last = 0, g_raf = null, g_running = false, g_unlocked = false;
function fitStage() {
  const k = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}
addEventListener('resize', fitStage, { passive: true });
fitStage();

function playhead() {
  if (EXPORT) return g_playFrom;
  if (A.ctx && A.started && A.ctx.state === 'running') return Math.max(0, A.ctx.currentTime - A.base);
  return g_playFrom;
}
function loop(ts) {
  g_raf = requestAnimationFrame(loop);
  if (!g_running) { g_last = ts; return; }
  const t = playhead();
  g_playFrom = t;
  if (t >= DURATION) { g_playFrom = 0; if (A.started) audioLoop(); }
  renderAt(g_playFrom);
  g_last = ts;
}
function startPlayer() { if (!g_running) { g_running = true; } }
function pausePlayer() { g_running = false; }

if (EXPORT) {
  document.body.classList.add('export');
  renderAt(0);
} else {
  g_running = true;
  g_raf = requestAnimationFrame(loop);
}

function firstGesture() {
  if (g_unlocked) return;
  g_unlocked = true;
  audioInit();
  audioStart();          /* birinchi bosish ovozni OCHIQ qoldiradi */
  ['pointerdown','keydown','touchstart'].forEach(ev2 => removeEventListener(ev2, firstGesture, true));
}
['pointerdown','keydown','touchstart'].forEach(ev2 => addEventListener(ev2, firstGesture, true));

const sBtn = $('#soundBtn');
sBtn.addEventListener('click', e => {
  e.stopPropagation();
  audioInit();
  A.muted = !A.muted;
  A.on = !A.muted;
  sBtn.setAttribute('aria-pressed', String(!A.muted));
  sBtn.setAttribute('aria-label', A.muted ? 'Ovozni yo‘qish' : 'Ovozni o‘chirish');
  audioMute();
  if (!A.muted && A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
  if (!A.muted && A.ctx && A.ctx.state === 'running' && !A.started) audioStart();
  if (!A.muted && A.started) audioSeek(Math.max(0, playhead()));
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pausePlayer(); if (A.ctx) A.ctx.suspend(); }
  else { if (!EXPORT) { startPlayer(); if (A.ctx) A.ctx.resume(); } }
});
addEventListener('pagehide', audioDispose);

/* ================================================================
   11) EKSPORT API + SELFTEST
   ================================================================ */
window.__FPS = FPS;
window.__DURATION = DURATION;
window.__SCENES = SCENES;
window.__EVENTS = EVENTS;
window.__renderAt = renderAt;
window.__renderAudioWav = renderAudioWav;
window.__masterGain = MASTER_GAIN;
window.__ready = Promise.all([
  document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
  CONFIG.image ? new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = CONFIG.image; }) : Promise.resolve()
]).then(() => { renderAt(0); return true; });

window.__selftest = function () {
  const r = [];
  const ids = $$('[id]').map(n => n.id);
  r.push(['unique ids', ids.length === new Set(ids).size]);
  r.push(['bars = scenes', BARS.length === N_SCENES]);
  r.push(['scene nodes', SCENE_EL.every(Boolean) && SCENE_EL.length === N_SCENES]);
  r.push(['duration sum', Math.abs(DURATION - SCENES.reduce((a, s) => a + s.dur, 0)) < 1e-9]);
  r.push(['scene visible at t=0', SCENE_EL[0].style.visibility === 'visible']);
  r.push(['cuts = scenes-1', EVENTS.filter(e => e.type === 'cut').length === N_SCENES - 1]);
  r.push(['one impact', EVENTS.filter(e => e.type === 'impact').length === 1]);
  r.push(['price + cta sounds', EVENTS.some(e => e.type === 'price') && EVENTS.some(e => e.type === 'cta')]);
  r.push(['sound for every cue', $$('[data-sfx-type]').every(el => {
      const h = el.closest('[data-scene]'); if (!h) return false;
      const t0 = SCENES[+h.dataset.scene].start + (parseFloat(el.dataset.sfxDelay) || 0) / 1000;
      return EVENTS.some(e => e.type === el.dataset.sfxType && Math.abs(e.t - t0) < 1e-6);
    })]);
  const a = renderAt(5), snap = SCENE_EL.map(n => n.style.opacity + n.style.visibility).join('|');
  renderAt(5);
  const snap2 = SCENE_EL.map(n => n.style.opacity + n.style.visibility).join('|');
  r.push(['idempotent @5s', snap === snap2]);
  r.push(['durations', SCENES.map(s => s.id + ':' + s.dur).join(', ')]);
  r.push(['events', EVENTS.length + ' · ' + a.toFixed(2) + 's']);
  r.forEach(x => console.log((x[1] === true ? 'PASS' : typeof x[1] === 'boolean' ? 'FAIL' : 'INFO') + ' — ' + x[0] + (typeof x[1] === 'boolean' && x[1] ? '' : ' : ' + x[1])));
  const fails = r.filter(x => x[1] === false).length;
  console.log(fails ? fails + ' ta tekshiruv muvaffaqiyatsiz' : 'barcha tekshiruvlar o‘tdi');
  return r;
};
if (SELFTEST) window.__ready.then(() => window.__selftest());
</script>
